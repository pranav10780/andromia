<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis Health Co-Pilot</title>
    <style>
        body {		
            font-family: 'Courier New', Courier, monospace;
            background-color: #f8fafc; /* Very light gray/blue */
            color: #0f172a; /* Dark text for high readability */
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
	    }
	    .card {
            background-color: #ffffff; /* Solid white */
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); /* Subtle shadow for depth */
            margin-bottom: 20px;
	    }
	    label { 
            display: block; 
            margin-bottom: 5px; 
            color: #475569; 
            font-weight: 600;
	    }
	    input {
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px;
            background-color: #f8fafc; 
            color: #0f172a;
            border: 1px solid #cbd5e1; 
            border-radius: 4px; 
            box-sizing: border-box;
	    }
	    input:focus {
            outline: none;
            border-color: #2563eb;
	    }
	    button {
            width: 100%; 
            padding: 12px;
            background-color: #2563eb; 
            color: white;
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
	    }
	    button:hover { background-color: #1d4ed8; }
	    button.secondary { 
            background-color: #e2e8f0; 
            color: #334155; 
            margin-top: 15px; 
	    }
	    button.secondary:hover { background-color: #cbd5e1; }
	    
	    .metric-group { margin-bottom: 15px; }
	    meter { width: 100%; height: 20px; }
	    .alert-box {
            padding: 15px; 
            border-radius: 4px; 
            margin-top: 15px;
            background-color: #fee2e2;
            border: 1px solid #ef4444; 
            color: #991b1b;
            display: none;
	    }
	</style>
</head>
<body>

    <h2>Health Co-Pilot</h2>

    <!-- The form -->
    <div id="input-view" class="card">
        <form id="healthForm">
            <label>Systolic BP (mmHg):</label>
            <input type="number" id="systolic" required>

            <label>Diastolic BP (mmHg):</label>
            <input type="number" id="diastolic" required>

            <label>Sleep (Hours):</label>
            <input type="number" id="sleep" step="0.1" required>

            <label>Mood (1-10):</label>
            <input type="number" id="mood" min="1" max="10" required>

            <button type="submit">Analyze Health Data</button>
        </form>
    </div>

    <!-- The dashboard -->
    <div id="dashboard-view" class="card" style="display: none;">
        <h3>Live Diagnostics</h3>
        
        <div class="metric-group">
            <label>Systolic Blood Pressure: <span id="sys-val">--</span></label>
            <meter id="sys-meter" min="80" max="200" low="90" high="130" optimum="110" value="0"></meter>
        </div>

        <div class="metric-group">
            <label>Sleep Logged: <span id="sleep-val">--</span> hrs</label>
            <meter id="sleep-meter" min="0" max="12" low="6" high="10" optimum="8" value="0"></meter>
        </div>

        <div id="action-alert" class="alert-box">
            <strong>Action Required:</strong>
            <p id="action-text"></p>
        </div>

        <button class="secondary" onclick="showInputForm()">← Log New Data</button>
    </div>

    <script>
        const inputView = document.getElementById('input-view');
        const dashboardView = document.getElementById('dashboard-view');
        const form = document.getElementById('healthForm');

        function showInputForm() {
            dashboardView.style.display = 'none';
            inputView.style.display = 'block';
            form.reset();
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); 
            
            const payload = {
                systolic_bp: parseInt(document.getElementById('systolic').value),
                diastolic_bp: parseInt(document.getElementById('diastolic').value),
                sleep_hours: parseFloat(document.getElementById('sleep').value),
                mood_score: parseInt(document.getElementById('mood').value)
            };

            await fetch('/api/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            inputView.style.display = 'none';
            dashboardView.style.display = 'block';

            loadDashboardData();
        });

        async function loadDashboardData() {
            const response = await fetch('/api/health/latest');
            const data = await response.json();
            const metrics = data.metrics;

	    document.getElementById('sys-val').textContent = metrics.systolic_bp;
            document.getElementById('sleep-val').textContent = metrics.sleep_hours;

            document.getElementById('sys-meter').value = metrics.systolic_bp;
            document.getElementById('sleep-meter').value = metrics.sleep_hours;

            const alertBox = document.getElementById('action-alert');
            const alertText = document.getElementById('action-text');
            
	    if (data.alert) {
		alertBox.style.display = 'block';
		alertText.textContent = data.alert;
	    } else {
		alertBox.style.display = 'none';
	    }	
        }
    </script>
</body>
</html>
